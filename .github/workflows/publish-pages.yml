name: Compilar y publicar CV en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar PDFs con LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            CV Javier Garoz Español.tex
            CV Javier Garoz English.tex

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp "CV Javier Garoz Español.pdf" _site/CV-Javier-Garoz-Espanol.pdf
          cp "CV Javier Garoz English.pdf" _site/CV-Javier-Garoz-English.pdf
          cat > _site/index.html <<'HTML'
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Javier Garoz</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         max-width: 640px; margin: 60px auto; padding: 0 20px; color: #222; line-height: 1.6; }
  h1 { border-bottom: 2px solid #0E5484; padding-bottom: 8px; }
  a { color: #0E5484; text-decoration: none; font-size: 18px; }
  li { margin: 12px 0; }
</style>
</head>
<body>
<h1>Javier Garoz — Curriculum Vitae</h1>
<ul>
  <li><a href="CV-Javier-Garoz-Espanol.pdf" target="_blank">Curriculum vitae (Español)</a></li>
  <li><a href="CV-Javier-Garoz-English.pdf" target="_blank">Curriculum vitae (English)</a></li>
</ul>
</body>
</html>
HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
