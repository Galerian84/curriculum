name: Compilar y publicar CV en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar PDFs con LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            CV Javier Garoz Español.tex
            CV Javier Garoz English.tex

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp "CV Javier Garoz Español.pdf" _site/CV-Javier-Garoz-Espanol.pdf
          cp "CV Javier Garoz English.pdf" _site/CV-Javier-Garoz-English.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
